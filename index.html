<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sally Monitor — Server Status</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e2e8f0; font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; align-items: center;
         padding: 48px 24px; min-height: 100vh; }
  h1 { color: #60a5fa; font-size: 1.6rem; margin-bottom: 8px; }
  .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 40px; }
  .card { background: #1e2433; border-radius: 12px; padding: 20px 24px;
          width: 100%; max-width: 520px; margin-bottom: 16px; }
  .server-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .server-url  { color: #94a3b8; font-size: 0.85rem; word-break: break-all; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 99px;
           font-size: 0.75rem; font-weight: 600; }
  .online  { background: #14532d; color: #4ade80; }
  .offline { background: #3b1212; color: #f87171; }
  .last-seen { color: #64748b; font-size: 0.8rem; margin-top: 6px; }
  .empty { color: #64748b; text-align: center; padding: 40px; }
  #ts { color: #475569; font-size: 0.78rem; margin-top: 32px; }
</style>
</head>
<body>
<h1>🛡️ Sally Monitor</h1>
<p class="sub">Live server directory — updated automatically</p>
<div id="list"><p class="empty">Loading…</p></div>
<p id="ts"></p>
<script>
const STALE_MS = 10 * 60 * 1000; // 10 minutes = offline

async function load() {
  const r = await fetch('servers.json?_=' + Date.now());
  const data = await r.json();
  const list = document.getElementById('list');
  const servers = data.servers || [];
  if (servers.length === 0) {
    list.innerHTML = '<p class="empty">No servers registered yet.</p>';
  } else {
    list.innerHTML = servers.map(s => {
      const age = Date.now() - new Date(s.last_seen).getTime();
      const online = age < STALE_MS;
      const ago = age < 60000 ? 'just now'
                : age < 3600000 ? Math.floor(age/60000) + ' min ago'
                : Math.floor(age/3600000) + ' hr ago';
      return `<div class="card">
        <div class="server-name">${s.name}</div>
        <div class="server-url">${s.url}</div>
        <span class="badge ${online ? 'online' : 'offline'}">${online ? '● Online' : '○ Offline'}</span>
        <div class="last-seen">Last seen: ${ago}</div>
      </div>`;
    }).join('');
  }
  document.getElementById('ts').textContent =
    'Directory updated ' + new Date(data.updated_at).toLocaleString();
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
